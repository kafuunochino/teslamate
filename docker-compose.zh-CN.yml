services:
  teslamate:
    build:
      context: .
      args:
        TESLAMATE_REVISION: ${TESLAMATE_REVISION:-}
    restart: always
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请在 .env 中设置 ENCRYPTION_KEY}
      DATABASE_USER: teslamate
      DATABASE_PASS: ${DATABASE_PASS:?请在 .env 中设置 DATABASE_PASS}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      MQTT_HOST: mosquitto
      DEFAULT_LOCALE: zh_Hans
      TZ: ${TZ:-Asia/Shanghai}
      # Direct Grafana login is the safe default. The legacy /dashboards proxy
      # remains available only when explicitly enabled.
      EMBED_GRAFANA: ${EMBED_GRAFANA:-false}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}
      # 程序会根据令牌区域自动选择中国区服务；仅在排查特殊网络问题时覆盖：
      # TESLA_API_HOST: https://owner-api.vn.cloud.tesla.cn
      # TESLA_WSS_HOST: wss://streaming.vn.cloud.tesla.cn
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./import:/opt/app/import
    cap_drop:
      - all
    depends_on:
      - database
      - mosquitto

  database:
    image: postgres:18-trixie
    restart: always
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: ${DATABASE_PASS:?请在 .env 中设置 DATABASE_PASS}
      POSTGRES_DB: teslamate
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - teslamate-db:/var/lib/postgresql

  grafana:
    # Bind only to loopback; publish it through an HTTPS reverse proxy.
    build:
      context: ./grafana
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_USER: teslamate
      DATABASE_PASS: ${DATABASE_PASS:?请在 .env 中设置 DATABASE_PASS}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_SSL_MODE: disable
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_PROXY_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
    depends_on:
      - database

  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-conf:/mosquitto/config
      - mosquitto-data:/mosquitto/data

volumes:
  teslamate-db:
  teslamate-grafana-data:
  mosquitto-conf:
  mosquitto-data:
