name: Unified platform verification

on:
  push:
    branches: ["agent/unified-multiuser-platform"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated_files_patch:
    name: Generate formatting and Gettext patch
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Format with the repository toolchain
        run: nix run .#lint

      - name: Setup Elixir for Gettext extraction
        uses: ./.github/actions/setup-elixir-and-cache-deps
        with:
          cache-name-deps: cache-elixir-deps
          cache-name-compiled: cache-compiled-dev-build
          mix-env: dev

      - name: Refresh the Gettext template
        run: mix gettext.extract

      - name: Export generated changes for review
        shell: bash
        run: |
          git diff --binary --output=/tmp/unified-platform-generated-files.patch
          git status --short

      - name: Upload generated changes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-platform-generated-files
          path: /tmp/unified-platform-generated-files.patch
          if-no-files-found: error

  spell_check:
    uses: ./.github/workflows/spell_check.yml

  ensure_linting:
    uses: ./.github/workflows/ensure_linting.yml

  elixir_static_analysis:
    uses: ./.github/workflows/elixir_dep_verification_and_static_analysis.yml

  elixir_test:
    uses: ./.github/workflows/elixir_test.yml

  compose_and_image:
    name: Compose config and Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate the 1Panel Compose model
        shell: bash
        run: |
          export DATABASE_PASS="$(openssl rand -hex 16)"
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export SECRET_KEY_BASE="$(openssl rand -hex 64)"
          export SIGNING_SALT="$(openssl rand -hex 16)"
          docker compose -f docker-compose.1panel.yml config >/tmp/teslamate-compose.yml
          test "$(grep -c 'published: "3000"' /tmp/teslamate-compose.yml)" -eq 1
          ! grep -q 'published: "4000"' /tmp/teslamate-compose.yml

      - name: Build the unified application image
        run: docker build --build-arg TESLAMATE_REVISION="$GITHUB_SHA" --tag teslamate-unified:verify .
