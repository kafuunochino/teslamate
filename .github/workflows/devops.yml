name: DevOps

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "**/*"
      - "!.github/**" # Important: Exclude PRs related to .github from auto-run
      - "!.github/workflows/**" # Important: Exclude PRs related to .github/workflows from auto-run
      - "!.github/actions/**" # Important: Exclude PRs related to .github/actions from auto-run
  pull_request:
    branches: ["main"]
    paths:
      - "**/*"
      - "!.github/**" # Important: Exclude PRs related to .github from auto-run
      - "!.github/workflows/**" # Important: Exclude PRs related to .github/workflows from auto-run
      - "!.github/actions/**" # Important: Exclude PRs related to .github/actions from auto-run

# Cancel any in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check_paths:
    uses: ./.github/workflows/check_paths.yml

  spell_check:
    needs: check_paths
    if: needs.check_paths.outputs.nongithub == 'true' || github.event_name == 'schedule'
    uses: ./.github/workflows/spell_check.yml

  ensure_linting:
    needs:
      - check_paths
      - spell_check
    if: needs.check_paths.outputs.nongithub == 'true' || github.event_name == 'schedule'
    uses: ./.github/workflows/ensure_linting.yml

  elixir_dep_verification_and_static_analysis:
    needs:
      - check_paths
      - ensure_linting
    if: needs.check_paths.outputs.nongithub == 'true' || github.event_name == 'schedule'
    uses: ./.github/workflows/elixir_dep_verification_and_static_analysis.yml

  elixir_test:
    needs:
      - check_paths
      - ensure_linting
    if: needs.check_paths.outputs.nongithub == 'true' || github.event_name == 'schedule'
    uses: ./.github/workflows/elixir_test.yml

  compose_and_image:
    name: Compose config and Docker image
    needs:
      - check_paths
      - ensure_linting
    if: needs.check_paths.outputs.nongithub == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate the 1Panel Compose model
        shell: bash
        run: |
          export DATABASE_PASS="$(openssl rand -hex 16)"
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export SECRET_KEY_BASE="$(openssl rand -hex 64)"
          export SIGNING_SALT="$(openssl rand -hex 16)"
          export PANEL_NETWORK="teslamate-cn_default"
          export GRAFANA_VOLUME_NAME="teslamate-cn_teslamate-grafana-data"

          docker compose -f docker-compose.1panel.yml config \
            >/tmp/teslamate-compose.yml
          docker compose -f docker-compose.1panel.yml \
            --profile legacy-grafana config \
            >/tmp/teslamate-compose-legacy.yml
          test "$(grep -c 'published: "3000"' /tmp/teslamate-compose.yml)" -eq 1
          ! grep -q 'published: "4000"' /tmp/teslamate-compose.yml
          ! docker compose -f docker-compose.1panel.yml config --services \
            | grep -qx database
          ! docker compose -f docker-compose.1panel.yml config --services \
            | grep -qx grafana

          sed -n \
            '/^  teslamate-grafana-data:$/,/^  [^ ]/p' \
            /tmp/teslamate-compose-legacy.yml \
            >/tmp/teslamate-grafana-volume.yml
          grep -qx '    name: teslamate-cn_teslamate-grafana-data' \
            /tmp/teslamate-grafana-volume.yml
          grep -qx '    external: true' /tmp/teslamate-grafana-volume.yml

      - name: Build the unified application image
        run: >-
          docker build
          --build-arg TESLAMATE_REVISION="$GITHUB_SHA"
          --tag teslamate-unified:verify .
